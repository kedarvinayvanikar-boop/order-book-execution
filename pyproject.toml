[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-execution"
version = "0.1.0"
description = "Order book reconstruction, queue simulation, and execution research"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "pandas>=2.2", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "pybind11>=2.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lob = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

name: correctness
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock -e .
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=$(which python)
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: PYTHONPATH=build:src python -m pytest -q
      - run: python scripts/run_simulation.py --events 500 --output results/smoke
      - run: python scripts/analyze_results.py --input results/smoke
